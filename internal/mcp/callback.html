<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#17181e">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='6'%20fill='%2317181e'/%3E%3Ctext%20x='16'%20y='24'%20text-anchor='middle'%20font-family='ui-monospace,%20Menlo,%20monospace'%20font-size='26'%20fill='%23a2adfd'%3E@%3C/text%3E%3C/svg%3E">
<title>{{if .OK}}signed in{{else}}sign-in failed{{end}} - zemi</title>
<!-- the landing page's palette and type (docs/index.html, docs/style.css); a sign-in page loads nothing remote -->
<style>
:root {
  color-scheme: dark;
  --bg: #17181e; --fg: #e7e7ec; --dim: #898b98; --panel: #202128; --danger: #f17070;
  --mono: "Paper Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: var(--bg); color: var(--fg);
  font: 400 0.9375rem/1.6 var(--mono);
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--fg); color: var(--bg); }

/* one centered block, its text left-aligned; only the failure reason's well
   ever scrolls, the page itself never does */
main {
  height: 100dvh;
  display: grid;
  place-items: center;
  padding-inline: clamp(1.25rem, 4vw, 4rem);
}
.intro {
  max-width: 60ch; min-width: 0; max-height: 100dvh;
  display: flex; flex-direction: column;
}
.intro > * { flex-shrink: 0; }
h1 {
  font-size: clamp(3.5rem, 8vh, 6rem);
  font-weight: 600;
  line-height: 1;
  margin: 0 0 0.75rem;
}
blockquote { color: var(--dim); margin: 0 0 1.25rem; overflow-wrap: anywhere; }
blockquote::before { content: "> "; }
blockquote b { color: var(--fg); font-weight: 600; }
blockquote.fail, blockquote.fail b { color: var(--danger); }
.dim { color: var(--dim); }
/* the provider's failure reason sits in the well, like the landing's install
   command, and scrolls inside itself */
.well {
  background: var(--panel);
  padding: 0.7rem 1ch;
  margin: 0 0 0.9rem;
  overflow-wrap: anywhere; white-space: pre-wrap;
  overflow: auto; flex: 0 1 auto; min-height: 0;
}
.next { margin: 0; }
</style>
</head>
<body>
<main>
  <section class="intro">
    <h1>zemi @{{if .OK}}^^{{else}}&gt;&lt;{{end}}</h1>
{{if .OK}}
    <blockquote>signed in to <b>{{.Server}}</b></blockquote>
    <p class="dim next" id="foot">You can close this tab and go back to your terminal.</p>
{{else}}
    <blockquote class="fail">could not sign in to <b>{{.Server}}</b></blockquote>
    <p class="well">{{.Reason}}</p>
    <p class="dim next">Go back to zemi and open /mcp to try again.</p>
{{end}}
  </section>
</main>
{{if .OK}}
<script>
  let n = 3; const foot = document.getElementById("foot");
  const tick = () => { if (n === 0) { window.close(); foot.textContent = "You can close this tab and go back to your terminal."; return; }
    foot.textContent = "This tab closes in " + n + "s."; n--; setTimeout(tick, 1000); };
  tick();
</script>
{{end}}
</body>
</html>
