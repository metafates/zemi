version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - unused
    - ineffassign
    - misspell
    - usestdlibvars
    - modernize
    - exhaustive
    - errorlint
    - unconvert
    - unparam
    - wastedassign
    - makezero
    - copyloopvar
    - intrange
    - nolintlint
    - perfsprint
    - errname
    - revive
    - sloglint
    - forcetypeassert
    - predeclared
  settings:
    govet:
      enable-all: true
      disable: [fieldalignment, shadow]
      settings:
        printf:
          funcs:
            - Usagef
            - RaiseScriptf
            - raisef
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*database/sql.Tx).Rollback
        - (*database/sql.Rows).Close
        - os.Remove
        - os.RemoveAll
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*net/http.Server).Close
        - (net.Listener).Close
        - (*database/sql.DB).Close
        - (*net/http.Server).Serve
        - (*github.com/metafates/zemi/internal/mcp.Client).Close
        - (*github.com/metafates/zemi/internal/lsp.Client).Close
        - (*github.com/metafates/zemi/internal/store.DB).Close
        - golang.org/x/sys/unix.Close
    exhaustive:
      check: [switch, mapliteral]
      explicit-exhaustive: true # only marked //exhaustive:enforce
      default-signifies-exhaustive: true
    perfsprint:
      errorf: false
      strconcat: false
      concat-loop: false
    staticcheck:
      checks: ["all", "-QF1001", "-QF1008"]
    usestdlibvars:
      time-layout: true
    revive:
      rules:
        - name: redundant-import-alias
        - name: import-alias-naming
        - name: indent-error-flow
        - name: superfluous-else
        - name: context-as-argument
          arguments: [{ allowTypesBefore: "*testing.T" }]
    sloglint:
      kv-only: true
      no-global: all
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      - path: (_test\.go|internal/mcp/mcptest/|internal/lsp/lsptest/)
        linters: [errcheck, unparam]
# golines left out: at any width it rewrites long calls into shapes that
# read worse than the line it split
formatters:
  enable: [gofumpt, goimports, gci]
  settings:
    gofumpt:
      extra:
        group-params: true
    goimports:
      local-prefixes: [github.com/metafates/zemi]
    gci:
      sections: [standard, default, localmodule]
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
